<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FakeSteam Login</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1b1b1b);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: #151515;
    padding: 40px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #00c0ff;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    background: #222;
    border: 1px solid #333;
    color: white;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #00c0ff;
    border: none;
    color: black;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #00a3d4;
}

.small {
    text-align: center;
    font-size: 12px;
    margin-top: 10px;
    color: #888;
}
</style>
</head>
<body>

<div class="login-box">
    <h2>FakeSteam</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Sign In</button>

    <div class="small">
        Gaming platform demo UI
    </div>
</div>

</body>
</html>
